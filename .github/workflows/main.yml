name: delivery

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'frontend/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: eastwesser/event-horizon

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  # Wave 4: gate internal/service coverage (≥70%). Gateway excluded.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Service-layer coverage gate
        run: MIN_COVERAGE=70 bash scripts/coverage-gate.sh

  build:
    needs: [lint, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # *.bin Dockerfiles COPY prebuilt binaries (gitignored). Build them first.
      - name: Build linux/amd64 service binaries
        run: |
          set -euo pipefail
          SERVICES=(
            auth billing game leaderboard profile shop gateway balancer
            inventory payment authors history analytics fulfillment notification
          )
          for svc in "${SERVICES[@]}"; do
            echo "===== BUILD $svc ====="
            (
              cd "services/$svc"
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
                go build -ldflags="-s -w" -o "${svc}-service" ./cmd/main.go
            )
          done
          # Dockerfile.nats-hub.bin expects services/nats-hub/nats-hub (not *-service)
          echo "===== BUILD nats-hub ====="
          (
            cd services/nats-hub
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -ldflags="-s -w" -o nats-hub ./cmd/main.go
          )

      - name: Build all services
        run: make docker-build-all

      - name: Push images to Docker Hub
        run: make docker-push-all
