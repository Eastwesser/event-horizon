syntax = "proto3";

package game;

option go_package = "event_horizon/services/game/proto;game";

import "validate/validate.proto";

service GameService {
    rpc SubmitScore(SubmitScoreRequest) returns (SubmitScoreResponse);
    rpc GetGameInfo(GetGameInfoRequest) returns (GetGameInfoResponse);
}

message SubmitScoreRequest {
    string user_id = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
    string game_id = 2 [(validate.rules).string = {min_len: 1, max_len: 32}];
    int32 level = 3 [(validate.rules).int32 = {gte: 0, lte: 100}];
    int32 score = 4 [(validate.rules).int32 = {gte: 0, lte: 100000}];
    string user_email = 5 [(validate.rules).string = {max_len: 254}];
    string nickname = 6 [(validate.rules).string = {max_len: 64}];
    string seed = 7 [(validate.rules).string = {max_len: 128}];
    repeated Move moves = 8 [(validate.rules).repeated = {max_items: 10000}];
    int32 client_version = 10;
}

message Move {
    int32 from_x = 1;
    int32 from_y = 2;
    int32 to_x = 3;
    int32 to_y = 4;
    int32 timestamp = 5;
}

message SubmitScoreResponse {
    bool success = 1;
    int32 new_highscore = 2;
    int32 rank = 3;
    string message = 4;
    int32 lamps_earned = 10;
    int32 tickets_earned = 11;
}

message GetGameInfoRequest {
    string game_id = 1 [(validate.rules).string = {min_len: 1, max_len: 32}];
}

message GetGameInfoResponse {
    string game_id = 1;
    string name = 2;
    string description = 3;
    repeated LevelInfo levels = 4;
}

message LevelInfo {
    int32 level = 1;
    int32 target_score = 2;
    int32 reward_lamps = 3;
    int32 reward_tickets = 4;
}
