syntax = "proto3";

package shop;

option go_package = "github.com/Eastwesser/event-horizon/services/shop/proto;shop";

service ShopService {
    rpc GetItems(GetItemsRequest) returns (GetItemsResponse);
    rpc PurchaseItem(PurchaseItemRequest) returns (PurchaseItemResponse);
    rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
}

message Item {
    string id = 1;
    string name = 2;
    string description = 3;
    int32 price = 4;
    string category = 5;     // 'game_skin', 'merch', 'profile_theme'
    string game_id = 6;      // 'flappy', 'hexagon', null для мерча
    string image_url = 7;
    bool available = 8;
    bool owned = 9;          // флаг, куплен ли текущим пользователем
    string purchased_at = 10; // дата покупки (RFC3339)
}

message GetItemsRequest {
    string category = 1;     // 'all', 'game_skin', 'merch'
    string game_id = 2;      // фильтр по игре (для кастомизации)
    string user_id = 3;      // для проверки owned
}

message GetItemsResponse {
    repeated Item items = 1;
}

message PurchaseItemRequest {
    string user_id = 1;
    string item_id = 2;
}

message PurchaseItemResponse {
    bool success = 1;
    string message = 2;
    int32 new_balance = 3;   // новый баланс билетиков после покупки
}

message GetInventoryRequest {
    string user_id = 1;
}

message GetInventoryResponse {
    repeated Item items = 1;
}
