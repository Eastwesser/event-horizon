apiVersion: v1
kind: Secret
metadata:
  name: event-horizon-auth-secrets
  namespace: default
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  # Overwrite this before applying to any real cluster — never commit a real
  # secret value here, this file only ships a placeholder for local/dev use.
  JWT_SECRET: "CHANGE_ME_generate_with_openssl_rand_base64_32"
