apiVersion: v1
kind: Secret
metadata:
  name: event-horizon-auth-secrets
  namespace: default
type: Opaque
stringData:
  # Generate before any real cluster apply — never commit production values.
  # JWT: openssl rand -base64 32
  JWT_SECRET: "CHANGE_ME_generate_with_openssl_rand_base64_32"
  POSTGRES_USER: "eventhorizon"
  POSTGRES_PASSWORD: "CHANGE_ME_postgres_password"
