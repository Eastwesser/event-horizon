# ============================================================
# Event Horizon — Docker Compose (кластерная версия)
# Все сервисы объединены в одну сеть event-horizon-net
# Версия: v1.0.5
# ============================================================

services:
  # ============================================================
  # 1. БАЗЫ ДАННЫХ И КЕШИ
  # ============================================================

  # --- PostgreSQL для Auth (пользователи) ---
  postgres:
    image: postgres:16-alpine
    container_name: event-horizon-postgres
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon
    ports:
      - "5460:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Auth (кеш сессий, JWT) ---
  redis:
    image: redis:7-alpine
    container_name: event-horizon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Game (рекорды) ---
  postgres-game:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-game
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_game
    ports:
      - "5461:5432"
    volumes:
      - postgres_game_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Game (кеш) ---
  redis-game:
    image: redis:7-alpine
    container_name: event-horizon-redis-game
    ports:
      - "6380:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Billing (балансы, транзакции) ---
  postgres-billing:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-billing
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_billing
    ports:
      - "5462:5432"
    volumes:
      - postgres_billing_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Billing (кеш балансов) ---
  redis-billing:
    image: redis:7-alpine
    container_name: event-horizon-redis-billing
    ports:
      - "6381:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Leaderboard (история топа) ---
  postgres-leaderboard:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-leaderboard
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_leaderboard
    ports:
      - "5463:5432"
    volumes:
      - postgres_leaderboard_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Leaderboard (Sorted Set для топа) ---
  redis-leaderboard:
    image: redis:7-alpine
    container_name: event-horizon-redis-leaderboard
    ports:
      - "6382:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Profile (агрегированный профиль) ---
  postgres-profile:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-profile
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_profile
    ports:
      - "5464:5432"
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Shop ---
  postgres-shop:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-shop
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_shop
    ports:
      - "5465:5432"
    volumes:
      - postgres_shop_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Shop ---
  redis-shop:
    image: redis:7-alpine
    container_name: event-horizon-redis-shop
    ports:
      - "6383:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory:
    image: eastwesser/inventory:latest
    container_name: deployments-inventory-1
    ports:
      - "50059:50059"
      - "9096:9099"
    environment:
      - INVENTORY_GRPC_PORT=50059
      - INVENTORY_METRICS_PORT=9099
      - INVENTORY_DRIVER=postgres
      - INVENTORY_PG_HOST=event-horizon-postgres-shop
      - INVENTORY_PG_PORT=5432
      - INVENTORY_PG_USER=eventhorizon
      - INVENTORY_PG_PASSWORD=eventhorizon
      - INVENTORY_PG_DB=eventhorizon_shop
      - INVENTORY_REDIS_ADDR=event-horizon-redis-shop:6379
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
    depends_on:
      - postgres-shop
      - redis-shop
      - nats-1
    networks:
      - event-horizon-net

  # ============================================================
  # 2. ЭКСПОРТЕРЫ ДЛЯ МОНИТОРИНГА
  # ============================================================

  # --- PostgreSQL Exporter (метрики БД для Prometheus) ---
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: event-horizon-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://eventhorizon:eventhorizon@event-horizon-postgres:5432/eventhorizon?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - event-horizon-net

  # --- Redis Exporter (метрики Redis для Prometheus) ---
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: event-horizon-redis-exporter
    environment:
      REDIS_ADDR: "redis://event-horizon-redis:6379"
    ports:
      - "9121:9121"
    networks:
      - event-horizon-net

  # ============================================================
  # 3. NATS КЛАСТЕР (3 ноды) С АЛИАСАМИ
  # ============================================================

  # --- NATS-1 (лидер кластера) ---
  nats-1:
    image: nats:2.10-alpine
    container_name: event-horizon-nats-1
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    command: [
      "-js",
      "--server_name", "nats-1",
      "--cluster_name", "event-horizon",
      "-m", "8222",
      "-cluster", "nats://0.0.0.0:6222",
      "-routes", "nats://nats-2:6222,nats://nats-3:6222"
    ]
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- NATS-2 (реплика) ---
  nats-2:
    image: nats:2.10-alpine
    container_name: event-horizon-nats-2
    ports:
      - "4223:4222"
      - "8223:8222"
      - "6223:6222"
    command: [
      "-js",
      "--server_name", "nats-2",
      "--cluster_name", "event-horizon",
      "-m", "8222",
      "-cluster", "nats://0.0.0.0:6222",
      "-routes", "nats://nats-1:6222,nats://nats-3:6222"
    ]
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- NATS-3 (реплика) ---
  nats-3:
    image: nats:2.10-alpine
    container_name: event-horizon-nats-3
    ports:
      - "4224:4222"
      - "8224:8222"
      - "6224:6222"
    command: [
      "-js",
      "--server_name", "nats-3",
      "--cluster_name", "event-horizon",
      "-m", "8222",
      "-cluster", "nats://0.0.0.0:6222",
      "-routes", "nats://nats-1:6222,nats://nats-2:6222"
    ]
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- NATS Exporter (собирает метрики со всех 3 нод) ---
  # nats-exporter:
  #   image: natsio/prometheus-nats-exporter:latest
  #   container_name: event-horizon-nats-exporter
  #   command: [
  #     "-varz", "http://nats-1:8222",
  #     "-varz", "http://nats-2:8222",
  #     "-varz", "http://nats-3:8222"
  #   ]
  #   ports:
  #     - "7777:7777"
  #   networks:
  #     - event-horizon-net
  #   depends_on:
  #     - nats-1
  #     - nats-2
  #     - nats-3
  #   restart: unless-stopped

  # # --- NATS Exporter для nats-1 ---
  # nats-exporter-1:
  #   image: natsio/prometheus-nats-exporter:latest
  #   container_name: nats-exporter-1
  #   command: ["-listen", ":7777", "-varz", "http://nats-1:8222"]
  #   ports:
  #     - "7777:7777"
  #   networks:
  #     - event-horizon-net
  #   depends_on:
  #     - nats-1
  #   restart: unless-stopped

  # # --- NATS Exporter для nats-2 ---
  # nats-exporter-2:
  #   image: natsio/prometheus-nats-exporter:latest
  #   container_name: nats-exporter-2
  #   command: ["-listen", ":7778", "-varz", "http://nats-2:8222"]
  #   ports:
  #     - "7778:7778"
  #   networks:
  #     - event-horizon-net
  #   depends_on:
  #     - nats-2
  #   restart: unless-stopped

  # # --- NATS Exporter для nats-3 ---
  # nats-exporter-3:
  #   image: natsio/prometheus-nats-exporter:latest
  #   container_name: nats-exporter-3
  #   command: ["-listen", ":7779", "-varz", "http://nats-3:8222"]
  #   ports:
  #     - "7779:7779"
  #   networks:
  #     - event-horizon-net
  #   depends_on:
  #     - nats-3
  #   restart: unless-stopped

  # --- NATS Exporter ---
  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: nats-exporter
    command: ["-varz", "http://nats-1:8222"]
    ports:
      - "7777:7777"
    networks:
      - event-horizon-net
    depends_on:
      - nats-1
    restart: unless-stopped 

  # --- NATS Hub (создаёт Stream'ы при старте) ---
  nats-hub:
    image: eastwesser/nats-hub:latest
    container_name: event-horizon-nats-hub
    environment:
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
    depends_on:
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net
    restart: on-failure


  # ============================================================
  # 4. МОНИТОРИНГ (Prometheus + Grafana + Jaeger)
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: event-horizon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - event-horizon-net

  grafana:
    image: grafana/grafana:latest
    container_name: event-horizon-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - event-horizon-net
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: event-horizon-jaeger
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP
      - "4317:4317"     # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - event-horizon-net


  # ============================================================
  # 5. МИКРОСЕРВИСЫ
  # ============================================================

  # --- Auth (аутентификация) ---
  auth:
    image: eastwesser/auth:latest
    container_name: deployments-auth-1
    ports:
      - "50051:50051"   # gRPC
      - "9091:9091"     # метрики
    environment:
      - METRICS_PORT=9091
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon
    networks:
      - event-horizon-net

  # --- Billing (внутриигровая валюта) ---
  billing:
    image: eastwesser/billing:latest
    container_name: deployments-billing-1
    ports:
      - "50053:50053"
      - "9093:9093"
    environment:
      - METRICS_PORT=9093
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres-billing
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_billing
      - REDIS_ADDR=event-horizon-redis-billing:6379
    restart: on-failure
    networks:
      - event-horizon-net

  # --- Game (игровая логика) ---
  game:
    image: eastwesser/game:latest
    container_name: deployments-game-1
    ports:
      - "50052:50052"
      - "9092:9092"
    environment:
      - METRICS_PORT=9092
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres-game
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_game
    networks:
      - event-horizon-net

  # --- Leaderboard (топ игроков) ---
  leaderboard:
    image: eastwesser/leaderboard:latest
    container_name: deployments-leaderboard-1
    ports:
      - "50054:50054"
      - "9094:9094"
    environment:
      - METRICS_PORT=9094
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - REDIS_ADDR=event-horizon-redis-leaderboard:6379
      - REDIS_DB=0
      - DB_HOST=event-horizon-postgres-game
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
    networks:
      - event-horizon-net
    depends_on:
      nats-1:
        condition: service_started
      nats-2:
        condition: service_started
      nats-3:
        condition: service_started
      nats-hub:
        condition: service_started

  # --- Profile (агрегатор пользовательских данных) ---
  profile:
    image: eastwesser/profile:latest
    container_name: deployments-profile-1
    ports:
      - "50060:50060"
      - "9099:9099"
    environment:
      - GRPC_PORT=50060
      - METRICS_PORT=9099
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres-profile
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_profile
    depends_on:
      nats-1:
        condition: service_started
      nats-2:
        condition: service_started
      nats-3:
        condition: service_started
      postgres-profile:
        condition: service_healthy
    networks:
      - event-horizon-net

  # --- Shop service ---
  shop:
    image: eastwesser/shop:latest
    container_name: deployments-shop-1
    ports:
      - "50055:50055"
      - "9095:9095"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9095/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - GRPC_PORT=50055
      - METRICS_PORT=9095
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres-shop
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_shop
      - REDIS_ADDR=event-horizon-redis-shop:6379
      - REDIS_DB=0
      - BILLING_ADDR=billing:50053
    depends_on:
      - postgres-shop
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net

  # --- Gateway (API Gateway, 3 инстанса) ---
  gateway:
    image: eastwesser/gateway:latest
    container_name: deployments-gateway-1
    command: ["/gateway"]
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - METRICS_PORT=9095
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - REDIS_ADDR=event-horizon-redis:6379
      - AUTH_ADDR=auth:50051
      - GAME_ADDR=game:50052
      - BILLING_ADDR=billing:50053
      - LEADERBOARD_ADDR=leaderboard:50054
      - PROFILE_ADDR=profile:50060
      - SHOP_ADDR=shop:50055
    depends_on:
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net

  gateway-2:
    image: eastwesser/gateway:latest
    container_name: deployments-gateway-2-1
    command: ["/gateway"]
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - METRICS_PORT=9096
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - REDIS_ADDR=event-horizon-redis:6379
      - AUTH_ADDR=auth:50051
      - GAME_ADDR=game:50052
      - BILLING_ADDR=billing:50053
      - LEADERBOARD_ADDR=leaderboard:50054
      - PROFILE_ADDR=profile:50060
      - SHOP_ADDR=shop:50055
    depends_on:
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net

  gateway-3:
    image: eastwesser/gateway:latest
    container_name: deployments-gateway-3-1
    command: ["/gateway"]
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - METRICS_PORT=9097
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - REDIS_ADDR=event-horizon-redis:6379
      - AUTH_ADDR=auth:50051
      - GAME_ADDR=game:50052
      - BILLING_ADDR=billing:50053
      - LEADERBOARD_ADDR=leaderboard:50054
      - PROFILE_ADDR=profile:50060
      - SHOP_ADDR=shop:50055
    depends_on:
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net

  # --- Balancer (Least Connections) ---
  balancer:
    image: eastwesser/balancer:latest
    container_name: deployments-balancer-1
    ports:
      - "8079:8079"   # HTTP
      - "9098:9098"   # метрики
    depends_on:
      - gateway
      - gateway-2
      - gateway-3
    networks:
      - event-horizon-net


