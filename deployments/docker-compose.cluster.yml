# ============================================================
# Event Horizon — Docker Compose (кластерная версия)
# Все сервисы объединены в одну сеть event-horizon-net
# Версия: v1.0.7
# ============================================================

services:
  # ============================================================
  # 1. БАЗЫ ДАННЫХ И КЕШИ
  # ============================================================

  # --- PostgreSQL для Auth (пользователи) ---
  postgres:
    image: postgres:16-alpine
    container_name: event-horizon-postgres
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon
    ports:
      - "5460:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Auth (кеш сессий, JWT) ---
  redis:
    image: redis:7-alpine
    container_name: event-horizon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Game (рекорды) ---
  postgres-game:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-game
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_game
    ports:
      - "5461:5432"
    volumes:
      - postgres_game_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Game (кеш) ---
  redis-game:
    image: redis:7-alpine
    container_name: event-horizon-redis-game
    ports:
      - "6380:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Billing (балансы, транзакции) ---
  postgres-billing:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-billing
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_billing
    ports:
      - "5462:5432"
    volumes:
      - postgres_billing_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Billing (кеш балансов) ---
  redis-billing:
    image: redis:7-alpine
    container_name: event-horizon-redis-billing
    ports:
      - "6381:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Leaderboard (история топа) ---
  postgres-leaderboard:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-leaderboard
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_leaderboard
    ports:
      - "5463:5432"
    volumes:
      - postgres_leaderboard_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Leaderboard (Sorted Set для топа) ---
  redis-leaderboard:
    image: redis:7-alpine
    container_name: event-horizon-redis-leaderboard
    ports:
      - "6382:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Profile (агрегированный профиль) ---
  postgres-profile:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-profile
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_profile
    ports:
      - "5464:5432"
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  # --- Redis для Profile (кеш агрегированного профиля) ---
  redis-profile:
    image: redis:7-alpine
    container_name: event-horizon-redis-profile
    ports:
      - "6385:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Shop ---
  postgres-shop:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-shop
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_shop
    ports:
      - "5465:5432"
    volumes:
      - postgres_shop_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Shop ---
  redis-shop:
    image: redis:7-alpine
    container_name: event-horizon-redis-shop
    ports:
      - "6383:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- PostgreSQL для Inventory (фенечки, мерч) ---
  postgres-inventory:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-inventory
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_inventory
    ports:
      - "5466:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis для Inventory (кеш товаров) ---
  redis-inventory:
    image: redis:7-alpine
    container_name: event-horizon-redis-inventory
    ports:
      - "6384:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. ЭКСПОРТЕРЫ ДЛЯ МОНИТОРИНГА
  # ============================================================

  # --- PostgreSQL Exporter (метрики БД для Prometheus) ---
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: event-horizon-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://eventhorizon:eventhorizon@event-horizon-postgres:5432/eventhorizon?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - event-horizon-net

  # --- Redis Exporter (метрики Redis для Prometheus) ---
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: event-horizon-redis-exporter
    environment:
      REDIS_ADDR: "redis://event-horizon-redis:6379"
    ports:
      - "9121:9121"
    networks:
      - event-horizon-net

  # ============================================================
  # 3. NATS КЛАСТЕР (3 ноды) С АЛИАСАМИ
  # ============================================================

  # --- NATS-1 (лидер кластера) ---
  nats-1:
    image: nats:2.10-alpine
    container_name: event-horizon-nats-1
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    command: [
      "-js",
      "--server_name", "nats-1",
      "--cluster_name", "event-horizon",
      "-m", "8222",
      "-cluster", "nats://0.0.0.0:6222",
      "-routes", "nats://nats-2:6222,nats://nats-3:6222"
    ]
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- NATS-2 (реплика) ---
  nats-2:
    image: nats:2.10-alpine
    container_name: event-horizon-nats-2
    ports:
      - "4223:4222"
      - "8223:8222"
      - "6223:6222"
    command: [
      "-js",
      "--server_name", "nats-2",
      "--cluster_name", "event-horizon",
      "-m", "8222",
      "-cluster", "nats://0.0.0.0:6222",
      "-routes", "nats://nats-1:6222,nats://nats-3:6222"
    ]
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- NATS-3 (реплика) ---
  nats-3:
    image: nats:2.10-alpine
    container_name: event-horizon-nats-3
    ports:
      - "4224:4222"
      - "8224:8222"
      - "6224:6222"
    command: [
      "-js",
      "--server_name", "nats-3",
      "--cluster_name", "event-horizon",
      "-m", "8222",
      "-cluster", "nats://0.0.0.0:6222",
      "-routes", "nats://nats-1:6222,nats://nats-2:6222"
    ]
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- NATS Exporter ---
  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: nats-exporter
    command: ["-varz", "http://event-horizon-nats-1:8222"]
    ports:
      - "7777:7777"
    networks:
      - event-horizon-net
    depends_on:
      - nats-1
    restart: unless-stopped

  # --- NATS Hub (создаёт Stream'ы при старте) ---
  nats-hub:
    image: eastwesser/nats-hub:latest
    container_name: event-horizon-nats-hub
    ports:
      - "9097:9097"
    environment:
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
    depends_on:
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net
    restart: on-failure


  # ============================================================
  # 4. МОНИТОРИНГ (Prometheus + Grafana + Jaeger)
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: event-horizon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - event-horizon-net

  grafana:
    image: grafana/grafana:latest
    container_name: event-horizon-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - event-horizon-net
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: event-horizon-jaeger
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP
      - "4317:4317"     # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - event-horizon-net


  # --- Kafka (KRaft, Week 5) ---
  kafka:
    image: apache/kafka:3.8.1
    container_name: event-horizon-kafka
    ports:
      # Host 19092 — Game metrics already binds host 9092.
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s


  # ============================================================
  # 5. МИКРОСЕРВИСЫ
  # ============================================================

  # --- Auth (аутентификация) ---
  auth:
    image: eastwesser/auth:latest
    container_name: deployments-auth-1
    ports:
      - "50051:50051"   # gRPC
      - "9091:9091"     # метрики
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9091/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - METRICS_PORT=9091
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon
      - REDIS_ADDR=event-horizon-redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXP_HOURS=${JWT_EXP_HOURS:-24}
      - USER_CACHE_TTL_MINUTES=${USER_CACHE_TTL_MINUTES:-5}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - event-horizon-net

  # --- Billing (внутриигровая валюта) ---
  billing:
    image: eastwesser/billing:latest
    container_name: deployments-billing-1
    ports:
      - "50053:50053"
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9093/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - METRICS_PORT=9093
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres-billing
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_billing
      - REDIS_ADDR=event-horizon-redis-billing:6379
    restart: on-failure
    networks:
      - event-horizon-net

  # --- Game (игровая логика) ---
  game:
    image: eastwesser/game:latest
    container_name: deployments-game-1
    ports:
      - "50052:50052"
      - "9092:9092"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9092/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - METRICS_PORT=9092
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres-game
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_game
    networks:
      - event-horizon-net

  # --- Leaderboard (топ игроков) ---
  leaderboard:
    image: eastwesser/leaderboard:latest
    container_name: deployments-leaderboard-1
    ports:
      - "50054:50054"
      - "9094:9094"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9094/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - METRICS_PORT=9094
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - REDIS_ADDR=event-horizon-redis-leaderboard:6379
      - REDIS_DB=0
      - DB_HOST=event-horizon-postgres-leaderboard
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_leaderboard
    networks:
      - event-horizon-net
    depends_on:
      nats-1:
        condition: service_started
      nats-2:
        condition: service_started
      nats-3:
        condition: service_started
      nats-hub:
        condition: service_started
      postgres-leaderboard:
        condition: service_healthy

  # --- Profile (агрегатор пользовательских данных) ---
  profile:
    image: eastwesser/profile:latest
    container_name: deployments-profile-1
    ports:
      - "50060:50060"
      - "9099:9099"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9099/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - GRPC_PORT=50060
      - METRICS_PORT=9099
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres-profile
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_profile
      - REDIS_ADDR=event-horizon-redis-profile:6379
    depends_on:
      nats-1:
        condition: service_started
      nats-2:
        condition: service_started
      nats-3:
        condition: service_started
      postgres-profile:
        condition: service_healthy
      redis-profile:
        condition: service_healthy
    networks:
      - event-horizon-net

  # --- Shop service ---
  shop:
    image: eastwesser/shop:latest
    container_name: deployments-shop-1
    ports:
      - "50055:50055"
      - "9095:9095"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9095/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - GRPC_PORT=50055
      - METRICS_PORT=9095
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - DB_HOST=event-horizon-postgres-shop
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_shop
      - REDIS_ADDR=event-horizon-redis-shop:6379
      - REDIS_DB=0
      - BILLING_ADDR=billing:50053
      - PAYMENT_ADDR=payment:50058
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres-shop
      - nats-1
      - nats-2
      - nats-3
      - kafka
    networks:
      - event-horizon-net

  # --- Fulfillment (Week 5 Assembly analogue) ---
  fulfillment:
    image: eastwesser/fulfillment:latest
    container_name: deployments-fulfillment-1
    ports:
      - "9101:9101"
    environment:
      - METRICS_PORT=9101
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_started
    networks:
      - event-horizon-net
    restart: unless-stopped

  # --- Notification (Week 5 Telegram consumer) ---
  notification:
    image: eastwesser/notification:latest
    container_name: deployments-notification-1
    ports:
      - "9102:9102"
    environment:
      - METRICS_PORT=9102
      - KAFKA_BROKERS=kafka:9092
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - LOG_LEVEL=info
    depends_on:
      kafka:
        condition: service_started
    networks:
      - event-horizon-net
    restart: unless-stopped

  # --- Inventory service ---
  inventory:
    image: eastwesser/inventory:latest
    container_name: deployments-inventory-1
    ports:
      - "50059:50059"
      - "9096:9096"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9096/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - INVENTORY_GRPC_PORT=50059
      - INVENTORY_METRICS_PORT=9096
      - INVENTORY_DRIVER=postgres
      - INVENTORY_PG_HOST=event-horizon-postgres-inventory
      - INVENTORY_PG_PORT=5432
      - INVENTORY_PG_USER=eventhorizon
      - INVENTORY_PG_PASSWORD=eventhorizon
      - INVENTORY_PG_DB=eventhorizon_inventory
      - INVENTORY_REDIS_ADDR=event-horizon-redis-inventory:6379
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
    depends_on:
      - postgres-inventory
      - redis-inventory
      - nats-1
    networks:
      - event-horizon-net

  # --- PostgreSQL for Payment (subscriptions) ---
  postgres-payment:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-payment
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_payment
    ports:
      - "5467:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-payment:
    image: redis:7-alpine
    container_name: event-horizon-redis-payment
    ports:
      - "6386:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment:
    image: eastwesser/payment:latest
    container_name: deployments-payment-1
    ports:
      - "50058:50058"
      - "9103:9103"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9103/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - GRPC_PORT=50058
      - METRICS_PORT=9103
      - DB_HOST=event-horizon-postgres-payment
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_payment
      - REDIS_ADDR=event-horizon-redis-payment:6379
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - BOOSTY_CHECKOUT_URL=${BOOSTY_CHECKOUT_URL:-https://boosty.to/eastwesser}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - SUBSCRIPTION_DAYS=30
      - LOG_LEVEL=info
    depends_on:
      - postgres-payment
      - redis-payment
      - nats-1
    networks:
      - event-horizon-net
    restart: unless-stopped

  # --- Authors (catalog profiles) ---
  postgres-authors:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-authors
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_authors
    ports:
      - "5468:5432"
    volumes:
      - postgres_authors_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-authors:
    image: redis:7-alpine
    container_name: event-horizon-redis-authors
    ports:
      - "6387:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  authors:
    image: eastwesser/authors:latest
    container_name: deployments-authors-1
    ports:
      - "50061:50061"
      - "9104:9104"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9104/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - GRPC_PORT=50061
      - METRICS_PORT=9104
      - DB_HOST=event-horizon-postgres-authors
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_authors
      - REDIS_ADDR=event-horizon-redis-authors:6379
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - LOG_LEVEL=info
    depends_on:
      - postgres-authors
      - redis-authors
      - nats-1
    networks:
      - event-horizon-net
    restart: unless-stopped

  # --- History (event trail, retention) ---
  postgres-history:
    image: postgres:16-alpine
    container_name: event-horizon-postgres-history
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_history
    ports:
      - "5469:5432"
    volumes:
      - postgres_history_data:/var/lib/postgresql/data
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 5s
      retries: 5

  history:
    image: eastwesser/history:latest
    container_name: deployments-history-1
    ports:
      - "50062:50062"
      - "9105:9105"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9105/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - GRPC_PORT=50062
      - METRICS_PORT=9105
      - DB_HOST=event-horizon-postgres-history
      - DB_PORT=5432
      - DB_USER=eventhorizon
      - DB_PASSWORD=eventhorizon
      - DB_NAME=eventhorizon_history
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - RETENTION_DAYS=30
      - LOG_LEVEL=info
    depends_on:
      - postgres-history
      - nats-1
    networks:
      - event-horizon-net
    restart: unless-stopped

  # --- Analytics (ClickHouse OLAP) ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: event-horizon-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      # Official image otherwise writes users.d/default-user.xml that only allows
      # default@127.0.0.1 — analytics (other container) then gets Authentication failed.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_DB: eventhorizon
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/users.d/default-network.xml:/etc/clickhouse-server/users.d/default-network.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  analytics:
    image: eastwesser/analytics:latest
    container_name: deployments-analytics-1
    ports:
      - "50057:50057"
      - "9106:9106"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9106/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - GRPC_PORT=50057
      - METRICS_PORT=9106
      - CLICKHOUSE_URL=http://event-horizon-clickhouse:8123
      - CLICKHOUSE_DB=eventhorizon
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - LOG_LEVEL=info
    depends_on:
      - clickhouse
      - nats-1
    networks:
      - event-horizon-net
    restart: unless-stopped

  # --- Gateway (API Gateway, 3 инстанса) ---
  gateway:
    image: eastwesser/gateway:latest
    container_name: deployments-gateway-1
    command: ["/gateway"]
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - PORT=8080
      - METRICS_PORT=9095
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - REDIS_ADDR=event-horizon-redis:6379
      - AUTH_ADDR=auth:50051
      - GAME_ADDR=game:50052
      - BILLING_ADDR=billing:50053
      - LEADERBOARD_ADDR=leaderboard:50054
      - PROFILE_ADDR=profile:50060
      - SHOP_ADDR=shop:50055
      - INVENTORY_ADDR=inventory:50059   # 👈 НОВОЕ!
      - PAYMENT_ADDR=payment:50058
      - AUTHORS_ADDR=authors:50061
      - HISTORY_ADDR=history:50062
      - ANALYTICS_ADDR=analytics:50057
    depends_on:
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net

  gateway-2:
    image: eastwesser/gateway:latest
    container_name: deployments-gateway-2-1
    command: ["/gateway"]
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - PORT=8080
      - METRICS_PORT=9096
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - REDIS_ADDR=event-horizon-redis:6379
      - AUTH_ADDR=auth:50051
      - GAME_ADDR=game:50052
      - BILLING_ADDR=billing:50053
      - LEADERBOARD_ADDR=leaderboard:50054
      - PROFILE_ADDR=profile:50060
      - SHOP_ADDR=shop:50055
      - INVENTORY_ADDR=inventory:50059   # 👈 НОВОЕ!
      - PAYMENT_ADDR=payment:50058
      - AUTHORS_ADDR=authors:50061
      - HISTORY_ADDR=history:50062
      - ANALYTICS_ADDR=analytics:50057
    depends_on:
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net

  gateway-3:
    image: eastwesser/gateway:latest
    container_name: deployments-gateway-3-1
    command: ["/gateway"]
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - PORT=8080
      - METRICS_PORT=9097
      - JAEGER_ENDPOINT=jaeger:4317
      # - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_URL=nats://event-horizon-nats-1:4222,event-horizon-nats-2:4222,event-horizon-nats-3:4222
      - REDIS_ADDR=event-horizon-redis:6379
      - AUTH_ADDR=auth:50051
      - GAME_ADDR=game:50052
      - BILLING_ADDR=billing:50053
      - LEADERBOARD_ADDR=leaderboard:50054
      - PROFILE_ADDR=profile:50060
      - SHOP_ADDR=shop:50055
      - INVENTORY_ADDR=inventory:50059   # 👈 НОВОЕ!
      - PAYMENT_ADDR=payment:50058
      - AUTHORS_ADDR=authors:50061
      - HISTORY_ADDR=history:50062
      - ANALYTICS_ADDR=analytics:50057
    depends_on:
      - nats-1
      - nats-2
      - nats-3
    networks:
      - event-horizon-net

  # --- Balancer (Least Connections) ---
  balancer:
    image: eastwesser/balancer:latest
    container_name: deployments-balancer-1
    ports:
      - "8079:8079"   # HTTP
      - "9098:9098"   # метрики
    depends_on:
      - gateway
      - gateway-2
      - gateway-3
    networks:
      - event-horizon-net


# ============================================================
# 6. PERSISTENT VOLUMES
# ============================================================

volumes:
  postgres_data:
  redis_data:
  postgres_game_data:
  postgres_billing_data:
  postgres_leaderboard_data:
  prometheus_data:
  grafana_data:
  postgres_profile_data:
  postgres_shop_data:
  postgres_inventory_data:
  postgres_payment_data:
  postgres_authors_data:
  postgres_history_data:
  clickhouse_data:


# ============================================================
# 7. СЕТЬ
# ============================================================

networks:
  event-horizon-net:
    driver: bridge