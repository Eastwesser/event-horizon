events {
    worker_connections 4096;
}

http {
    # Теперь Nginx кидает трафик не на гейтвеи, а на два наших балансера
    upstream balancer_backend {
        server balancer:8079   max_fails=0;
        server balancer-2:8079 max_fails=0;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ---- HTTP API ----
        location / {
            proxy_pass http://balancer_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";


            # Ретрай только на connection error / timeout (соединение не установлено).
            # http_502 УБРАН: сервер ответил ошибкой — ретрай дублирует запрос.
            proxy_next_upstream               error timeout;
            proxy_next_upstream_tries         2;
            proxy_next_upstream_timeout       3s;

            # # Ретрай: connection error / timeout / 502.
            # # 502 безопасен: балансер отдаёт его только когда gateway НЕ ответил (ErrorHandler),
            # # т.е. операция на gateway не выполнялась. 503 (CB open) и 504 (таймаут после обработки)
            # # НЕ ретраим.
            # proxy_next_upstream               error timeout http_502;
            # proxy_next_upstream_tries         2;
            # proxy_next_upstream_timeout       3s;

            # Быстрый fail: 5s вместо 30s. p99 упадёт с 36s до ~5s.
            proxy_connect_timeout 1s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;

            # proxy_connect_timeout 2s;
            # proxy_send_timeout    30s;
            # proxy_read_timeout    30s;
        }

        # ---- WebSocket ----
        # ВАЖНО: proxy_next_upstream не работает для upgrade-соединений.
        # Если handshake не удался — браузер сам переподключится.
        location /ws/ {
            proxy_pass http://balancer_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 2s;
        }
    }
}
