global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth'
    static_configs:
      - targets: ['auth:50051']
    metrics_path: '/metrics'

  - job_name: 'billing'
    static_configs:
      - targets: ['billing:50053']
    metrics_path: '/metrics'

  - job_name: 'game'
    static_configs:
      - targets: ['game:50052']
    metrics_path: '/metrics'

  - job_name: 'leaderboard'
    static_configs:
      - targets: ['leaderboard:50054']
    metrics_path: '/metrics'

  - job_name: 'gateway'
    static_configs:
      - targets: 
          - 'gateway:9095'
          - 'gateway-2:9096'
          - 'gateway-3:9097'

  - job_name: 'balancer'
    static_configs:
      - targets: ['balancer:8079']
    metrics_path: '/metrics'

  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/metrics'