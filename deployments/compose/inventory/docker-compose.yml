# Inventory dependencies: PostgreSQL + Redis + MongoDB (experimental)
services:
  postgres-inventory:
    image: postgres:16-alpine
    container_name: eh-compose-postgres-inventory
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventhorizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhorizon}
      POSTGRES_DB: eventhorizon_inventory
    ports:
      - "5466:5432"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U "$POSTGRES_USER""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-inventory:
    image: redis:7-alpine
    container_name: eh-compose-redis-inventory
    ports:
      - "6384:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo-inventory:
    image: mongo:7
    container_name: eh-compose-mongo-inventory
    ports:
      - "27017:27017"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  event-horizon-net:
    external: true
    name: event-horizon-net
