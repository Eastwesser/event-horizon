# Leaderboard dependencies
services:
  postgres-leaderboard:
    image: postgres:16-alpine
    container_name: eh-compose-postgres-leaderboard
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon_leaderboard
    ports:
      - "5464:5432"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-leaderboard:
    image: redis:7-alpine
    container_name: eh-compose-redis-leaderboard
    ports:
      - "6380:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  event-horizon-net:
    external: true
    name: event-horizon-net
