# Auth dependencies: PostgreSQL + Redis (Week 3 modular compose)
services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: eh-compose-postgres-auth
    environment:
      POSTGRES_USER: eventhorizon
      POSTGRES_PASSWORD: eventhorizon
      POSTGRES_DB: eventhorizon
    ports:
      - "5460:5432"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhorizon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-auth:
    image: redis:7-alpine
    container_name: eh-compose-redis-auth
    ports:
      - "6379:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  event-horizon-net:
    external: true
    name: event-horizon-net
