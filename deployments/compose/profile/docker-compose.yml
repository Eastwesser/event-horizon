# Profile dependencies
services:
  postgres-profile:
    image: postgres:16-alpine
    container_name: eh-compose-postgres-profile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventhorizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhorizon}
      POSTGRES_DB: eventhorizon_profile
    ports:
      - "5465:5432"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U "$POSTGRES_USER""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-profile:
    image: redis:7-alpine
    container_name: eh-compose-redis-profile
    ports:
      - "6383:6379"
    networks:
      - event-horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  event-horizon-net:
    external: true
    name: event-horizon-net
