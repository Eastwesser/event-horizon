# Used when TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are unset — alerts still fire into a null receiver.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'

receivers:
  - name: 'null'

inhibit_rules: []
