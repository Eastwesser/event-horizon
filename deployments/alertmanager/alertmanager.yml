global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    # Wire Telegram when TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID are set.
    # See deployments/alertmanager/README.md

inhibit_rules: []
