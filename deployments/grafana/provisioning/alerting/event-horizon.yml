apiVersion: 1

groups:
  - orgId: 1
    name: event-horizon
    folder: Event Horizon
    interval: 1m
    rules:
      - uid: eh-gateway-p95
        title: Gateway p95 latency high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le))
              refId: A
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
                  operator: { type: and }
                  reducer: { type: last }
                  type: query
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Gateway p95 > 2s for 5m

      - uid: eh-gateway-5xx
        title: Gateway 5xx rate high
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rate(gateway_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(gateway_requests_total[5m])), 1e-9)
              refId: A
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  reducer: { type: last }
                  type: query
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Gateway 5xx ratio > 5% for 5m
