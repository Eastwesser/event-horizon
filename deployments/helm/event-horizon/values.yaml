# Default values for event-horizon (Wave 4.5 + Track C data plane).
# App Deployment always rendered. NATS/Postgres STS opt-in via dataPlane.enabled.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  registry: eastwesser
  tag: latest
  pullPolicy: IfNotPresent

natsURL: "nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222"

# Same-pod gRPC: prefer 127.0.0.1 once Services are not split by name.
# Defaults mirror legacy deployments/k3s/deployment.yml for drop-in parity.
addrs:
  auth: "auth:50051"
  game: "game:50052"
  billing: "billing:50053"
  leaderboard: "leaderboard:50054"
  profile: "profile:50060"
  shop: "shop:50055"
  inventory: "inventory:50059"

db:
  userSecretKey: POSTGRES_USER
  passwordSecretKey: POSTGRES_PASSWORD
  hosts:
    auth: postgres
    billing: postgres-billing
    game: postgres-game
    leaderboard: postgres-leaderboard
    profile: postgres-profile
    shop: postgres-shop
    inventory: postgres-inventory
  names:
    auth: eventhorizon
    billing: eventhorizon_billing
    game: eventhorizon_game
    leaderboard: eventhorizon_leaderboard
    profile: eventhorizon_profile
    shop: eventhorizon_shop
    inventory: eventhorizon_inventory

redis:
  auth: "redis:6379"
  billing: "redis-billing:6379"
  leaderboard: "redis-leaderboard:6379"
  profile: "redis-profile:6379"
  shop: "redis-shop:6379"
  inventory: "redis-inventory:6379"
  gateway: "redis:6379"

# Track C — k3s data plane (off by default; compose remains day-to-day).
# Enable: helm upgrade --install eh … --set dataPlane.enabled=true
#   or: make deploy-k3s-dataplane
dataPlane:
  enabled: false
  nats:
    enabled: true
    image: nats:2.10-alpine
    pullPolicy: IfNotPresent
    jetStream: true
    clusterName: event-horizon
    # Service DNS names must match natsURL (nats-1..3).
    nodes:
      - name: nats-1
        routes: "nats://nats-2:6222,nats://nats-3:6222"
      - name: nats-2
        routes: "nats://nats-1:6222,nats://nats-3:6222"
      - name: nats-3
        routes: "nats://nats-1:6222,nats://nats-2:6222"
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ""
  postgres:
    enabled: true
    image: postgres:16-alpine
    pullPolicy: IfNotPresent
    # Instances derived from db.hosts + db.names (7 DBs used by the app chart).
    persistence:
      enabled: true
      size: 2Gi
      storageClassName: ""

secret:
  # Generate before real cluster apply — never commit production values.
  create: true
  name: event-horizon-auth-secrets
  jwtSecret: "CHANGE_ME_generate_with_openssl_rand_base64_32"
  postgresUser: "eventhorizon"
  postgresPassword: "CHANGE_ME_postgres_password"

service:
  type: ClusterIP
  httpPort: 8079
  gatewayTargetPort: 8080

ingress:
  enabled: true
  className: ""
  host: event-horizon.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

serviceAccount:
  create: false
