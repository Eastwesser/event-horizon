apiVersion: v1
kind: Service
metadata:
  name: {{ include "event-horizon.fullname" . }}
  labels:
    {{- include "event-horizon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "event-horizon.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.httpPort }}
    targetPort: {{ .Values.service.gatewayTargetPort }}
  - name: auth
    port: 50051
    targetPort: 50051
  - name: billing
    port: 50053
    targetPort: 50053
  - name: game
    port: 50052
    targetPort: 50052
  - name: leaderboard
    port: 50054
    targetPort: 50054
  - name: profile
    port: 50060
    targetPort: 50060
  - name: shop
    port: 50055
    targetPort: 50055
  - name: inventory
    port: 50059
    targetPort: 50059
