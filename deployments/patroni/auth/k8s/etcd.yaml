# STUB: single-node etcd for Patroni DCS. Replace with HA etcd/consul for real prod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: eh-patroni-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.15
          args:
            - etcd
            - --advertise-client-urls=http://0.0.0.0:2379
            - --listen-client-urls=http://0.0.0.0:2379
          ports:
            - containerPort: 2379
              name: client
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: eh-patroni-auth
spec:
  selector:
    app: etcd
  ports:
    - port: 2379
      targetPort: 2379
      name: client
