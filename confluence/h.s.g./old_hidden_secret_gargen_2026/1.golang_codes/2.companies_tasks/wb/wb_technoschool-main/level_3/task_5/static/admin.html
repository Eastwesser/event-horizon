<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventBooker - Админ-панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .nav a {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .nav a:hover {
            background: #667eea;
            color: white;
        }
        .create-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .events-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .events-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        .events-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .events-table tr:hover {
            background: #f8f9fa;
        }
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .message-success {
            background: #d4edda;
            color: #155724;
        }
        .message-error {
            background: #f8d7da;
            color: #721c24;
        }
        .bookings-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .booking-item {
            padding: 10px;
            background: white;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        .collapsible {
            cursor: pointer;
            user-select: none;
        }
        .collapsible:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ EventBooker - Админ-панель</h1>
            <p>Управление мероприятиями</p>
            <div class="nav">
                <a href="/">Главная</a>
                <a href="/admin">Админ-панель</a>
            </div>
        </div>

        <div id="message"></div>

        <div class="create-form">
            <h2>Создать мероприятие</h2>
            <form id="createEventForm">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="eventName" required>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="eventDescription"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Дата и время *</label>
                        <input type="datetime-local" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label>Количество мест *</label>
                        <input type="number" id="totalSeats" min="1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Срок оплаты (минуты) *</label>
                    <input type="number" id="timeoutMin" min="1" value="15" required>
                </div>
                <button type="submit" class="btn-primary">Создать мероприятие</button>
            </form>
        </div>

        <h2>Все мероприятия</h2>
        <table class="events-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Дата</th>
                    <th>Места</th>
                    <th>Срок оплаты</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="eventsTableBody"></tbody>
        </table>
    </div>

    <script>
        const API_URL = window.location.origin;

        function showMessage(text, type = 'success') {
            const msgDiv = document.getElementById('message');
            msgDiv.className = `message message-${type}`;
            msgDiv.textContent = text;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }

        document.getElementById('createEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const event = {
                name: document.getElementById('eventName').value,
                description: document.getElementById('eventDescription').value,
                event_date: new Date(document.getElementById('eventDate').value).toISOString(),
                total_seats: parseInt(document.getElementById('totalSeats').value),
                booking_timeout_min: parseInt(document.getElementById('timeoutMin').value)
            };

            try {
                const response = await fetch(`${API_URL}/events`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(event)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка создания мероприятия');
                }

                showMessage('Мероприятие успешно создано!');
                document.getElementById('createEventForm').reset();
                loadEvents();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        });

        async function loadEvents() {
            try {
                const response = await fetch(`${API_URL}/events`);
                const events = await response.json();

                const tbody = document.getElementById('eventsTableBody');
                
                tbody.innerHTML = events.map(event => {
                    const eventDate = new Date(event.event_date).toLocaleString('ru-RU', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    return `
                        <tr class="collapsible" onclick="toggleBookings('${event.id}')">
                            <td><strong>${event.name}</strong></td>
                            <td>${eventDate}</td>
                            <td>${event.available_seats} / ${event.total_seats}</td>
                            <td>${event.booking_timeout_min} мин</td>
                            <td>
                                <button class="btn-secondary" onclick="event.stopPropagation(); viewBookings('${event.id}')">
                                    Брони
                                </button>
                            </td>
                        </tr>
                        <tr id="bookings-${event.id}" style="display: none;">
                            <td colspan="5">
                                <div class="bookings-section">
                                    <div id="bookings-content-${event.id}">Загрузка...</div>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading events:', error);
                showMessage('Ошибка загрузки мероприятий', 'error');
            }
        }

        async function toggleBookings(eventId) {
            const bookingsRow = document.getElementById(`bookings-${eventId}`);
            const isVisible = bookingsRow.style.display !== 'none';

            if (isVisible) {
                bookingsRow.style.display = 'none';
            } else {
                bookingsRow.style.display = 'table-row';
                await loadBookings(eventId);
            }
        }

        async function viewBookings(eventId) {
            await toggleBookings(eventId);
        }

        async function loadBookings(eventId) {
            try {
                const response = await fetch(`${API_URL}/events/${eventId}/bookings`);
                const bookings = await response.json();

                const contentDiv = document.getElementById(`bookings-content-${eventId}`);

                if (bookings.length === 0) {
                    contentDiv.innerHTML = '<p style="text-align: center; color: #999;">Бронирований нет</p>';
                    return;
                }

                contentDiv.innerHTML = bookings.map(booking => {
                    const createdAt = new Date(booking.created_at).toLocaleString('ru-RU');
                    const expiresAt = new Date(booking.expires_at).toLocaleString('ru-RU');

                    return `
                        <div class="booking-item">
                            <div>
                                <strong>${booking.user_email}</strong>
                                <div style="font-size: 12px; color: #666;">
                                    Создано: ${createdAt} | Истекает: ${expiresAt}
                                </div>
                            </div>
                            <span class="status-badge status-${booking.status}">
                                ${booking.status === 'pending' ? 'Ожидает' : 
                                  booking.status === 'confirmed' ? 'Подтверждено' : 'Отменено'}
                            </span>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading bookings:', error);
            }
        }

        loadEvents();
        setInterval(loadEvents, 5000);
    </script>
</body>
</html>
