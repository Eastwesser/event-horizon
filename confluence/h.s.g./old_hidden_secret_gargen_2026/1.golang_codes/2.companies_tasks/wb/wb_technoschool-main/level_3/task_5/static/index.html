<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventBooker - Бронирование мероприятий</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .nav a {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .nav a:hover {
            background: #667eea;
            color: white;
        }
        .email-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .email-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .events-grid {
            display: grid;
            gap: 20px;
        }
        .event-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .event-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .event-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        .seats-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .seats-available {
            background: #d4edda;
            color: #155724;
        }
        .seats-low {
            background: #fff3cd;
            color: #856404;
        }
        .seats-full {
            background: #f8d7da;
            color: #721c24;
        }
        .event-info {
            color: #666;
            margin-bottom: 10px;
        }
        .event-date {
            color: #667eea;
            font-weight: 500;
        }
        .event-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .my-bookings {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #f0f0f0;
        }
        .booking-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .message-success {
            background: #d4edda;
            color: #155724;
        }
        .message-error {
            background: #f8d7da;
            color: #721c24;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 EventBooker</h1>
            <p>Бронирование мест на мероприятия</p>
            <div class="nav">
                <a href="/">Главная</a>
                <a href="/admin">Админ-панель</a>
            </div>
        </div>

        <div class="email-section">
            <label><strong>Ваш Email:</strong></label>
            <input type="email" id="userEmail" placeholder="user@example.com">
        </div>

        <div id="message"></div>

        <h2>Доступные мероприятия</h2>
        <div id="eventsList" class="events-grid"></div>

        <div class="my-bookings" id="myBookingsSection" style="display: none;">
            <h2>Мои бронирования</h2>
            <div id="bookingsList"></div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let userEmail = localStorage.getItem('userEmail') || '';
        
        document.getElementById('userEmail').value = userEmail;

        document.getElementById('userEmail').addEventListener('change', (e) => {
            userEmail = e.target.value;
            localStorage.setItem('userEmail', userEmail);
            if (userEmail) {
                loadUserBookings();
            }
        });

        function showMessage(text, type = 'success') {
            const msgDiv = document.getElementById('message');
            msgDiv.className = `message message-${type}`;
            msgDiv.textContent = text;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }

        async function loadEvents() {
            try {
                const response = await fetch(`${API_URL}/events`);
                const events = await response.json();
                
                const eventsList = document.getElementById('eventsList');
                
                if (events.length === 0) {
                    eventsList.innerHTML = '<div class="empty-state">Пока нет доступных мероприятий</div>';
                    return;
                }

                eventsList.innerHTML = events.map(event => {
                    const availableSeats = event.available_seats;
                    const totalSeats = event.total_seats;
                    const percentage = (availableSeats / totalSeats) * 100;
                    
                    let seatsClass = 'seats-available';
                    if (percentage < 20) seatsClass = 'seats-full';
                    else if (percentage < 50) seatsClass = 'seats-low';

                    const eventDate = new Date(event.event_date).toLocaleString('ru-RU', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    return `
                        <div class="event-card">
                            <div class="event-header">
                                <div class="event-name">${event.name}</div>
                                <div class="seats-badge ${seatsClass}">
                                    ${availableSeats} из ${totalSeats} мест
                                </div>
                            </div>
                            <div class="event-info">
                                <div class="event-date">📅 ${eventDate}</div>
                                <div>⏱️ Срок оплаты: ${event.booking_timeout_min} минут</div>
                            </div>
                            ${event.description ? `<p>${event.description}</p>` : ''}
                            <div class="event-actions">
                                <button class="btn-primary" onclick="bookEvent('${event.id}')" 
                                    ${availableSeats === 0 ? 'disabled' : ''}>
                                    ${availableSeats === 0 ? 'Мест нет' : 'Забронировать'}
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading events:', error);
                showMessage('Ошибка загрузки мероприятий', 'error');
            }
        }

        async function bookEvent(eventId) {
            if (!userEmail) {
                showMessage('Укажите ваш email', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/events/${eventId}/book`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_email: userEmail })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка бронирования');
                }

                showMessage('Бронирование успешно создано! Подтвердите его в течение указанного времени.');
                loadEvents();
                loadUserBookings();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function confirmBooking(bookingId) {
            try {
                const response = await fetch(`${API_URL}/bookings/${bookingId}/confirm`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка подтверждения');
                }

                showMessage('Бронирование подтверждено!');
                loadUserBookings();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function loadUserBookings() {
            if (!userEmail) {
                document.getElementById('myBookingsSection').style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/bookings?email=${encodeURIComponent(userEmail)}`);
                const bookings = await response.json();

                document.getElementById('myBookingsSection').style.display = 'block';
                const bookingsList = document.getElementById('bookingsList');

                if (bookings.length === 0) {
                    bookingsList.innerHTML = '<div class="empty-state">У вас пока нет бронирований</div>';
                    return;
                }

                bookingsList.innerHTML = bookings.map(booking => {
                    const createdAt = new Date(booking.created_at).toLocaleString('ru-RU');
                    const expiresAt = new Date(booking.expires_at).toLocaleString('ru-RU');
                    const eventDate = new Date(booking.event_date).toLocaleString('ru-RU');

                    return `
                        <div class="booking-card">
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <div>
                                    <strong>${booking.event_name}</strong>
                                    <div style="color: #666; font-size: 14px; margin-top: 5px;">
                                        Мероприятие: ${eventDate}
                                    </div>
                                    <div style="color: #666; font-size: 14px;">
                                        Забронировано: ${createdAt}
                                    </div>
                                    ${booking.status === 'pending' ? `
                                        <div style="color: #856404; font-size: 14px;">
                                            Оплатить до: ${expiresAt}
                                        </div>
                                    ` : ''}
                                </div>
                                <div>
                                    <span class="status-badge status-${booking.status}">
                                        ${booking.status === 'pending' ? 'Ожидает оплаты' : 
                                          booking.status === 'confirmed' ? 'Подтверждено' : 'Отменено'}
                                    </span>
                                </div>
                            </div>
                            ${booking.status === 'pending' ? `
                                <div style="margin-top: 15px;">
                                    <button class="btn-primary" onclick="confirmBooking('${booking.id}')">
                                        Подтвердить оплату
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading bookings:', error);
            }
        }

        loadEvents();
        if (userEmail) {
            loadUserBookings();
        }

        setInterval(() => {
            loadEvents();
            if (userEmail) {
                loadUserBookings();
            }
        }, 5000);
    </script>
</body>
</html>
