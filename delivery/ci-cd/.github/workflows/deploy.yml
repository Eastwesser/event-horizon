name: delivery

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'frontend/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: eastwesser/event-horizon

jobs:
  # 1. Сборка и тестирование
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build all services
        run: |
          make build-all
          make test-all

      - name: Build and push images
        run: |
          make docker-build-all
          make docker-push-all

  # 2. Деплой на dev
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to dev
        run: |
          cd delivery
          ansible-playbook -i inventory/dev.ini ansible/site.yml \
            --extra-vars "env=dev version=${{ github.sha }}"

  # 3. Деплой на staging (ручной запуск)
  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          cd delivery
          ansible-playbook -i inventory/staging.ini ansible/site.yml \
            --extra-vars "env=staging version=${{ github.sha }}"

  # 4. Деплой на production (ручной запуск с подтверждением)
  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          cd delivery
          ansible-playbook -i inventory/prod.ini ansible/site.yml \
            --extra-vars "env=prod version=${{ github.sha }}"