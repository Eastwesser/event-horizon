- name: Prepare servers for Event Horizon
  hosts: all
  become: yes
  vars:
    deploy_env: "{{ env | default('dev') }}"
    commit_hash: "{{ version | default('main') }}"
    project_dir: /opt/event-horizon

  tasks:
    - name: Install required packages (Arch)
      pacman:
        name:
          - docker
          - docker-compose
          - git
          - curl
          - jq
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Archlinux"

    - name: Install required packages (Debian)
      apt:
        name:
          - docker.io
          - docker-compose
          - git
          - curl
          - jq
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Enable and start Docker (Arch)
      systemd:
        name: docker
        state: started
        enabled: yes
      when: ansible_facts['os_family'] == "Archlinux"

    - name: Enable and start Docker (Debian)
      systemd:
        name: docker
        state: started
        enabled: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    - name: Clone or update repository
      git:
        repo: "https://github.com/Eastwesser/event-horizon.git"
        dest: "{{ project_dir }}"
        version: "{{ commit_hash }}"
        force: yes

    - name: Copy .env file
      copy:
        content: |
          ENV={{ deploy_env }}
          VERSION={{ version | default('latest') }}
        dest: "{{ project_dir }}/.env"
        mode: '0644'

    - name: Create directories for volumes
      file:
        path: "{{ project_dir }}/volumes/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - postgres
        - redis
        - nats
        - grafana
        - prometheus

    - name: Ensure proper permissions for Docker socket
      file:
        path: /var/run/docker.sock
        state: file
        mode: '0666'

    - name: Ensure project directory exists before pulling
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    - name: Pull latest images
      command: docker-compose -f deployments/docker-compose.cluster.yml pull
      args:
        chdir: "{{ project_dir }}"

    - name: Start docker-compose
      command: docker-compose -f deployments/docker-compose.cluster.yml up -d --remove-orphans
      args:
        chdir: "{{ project_dir }}"

    - name: Wait for services to be healthy
      wait_for:
        timeout: 30

    - name: Check services status
      uri:
        url: "http://localhost:{{ item }}"
        status_code: 200
      loop:
        - "8079/health"
        - "9090"
        - "3000"
      ignore_errors: yes
