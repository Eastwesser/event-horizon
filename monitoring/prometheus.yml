global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'auth'
    static_configs:
      - targets: ['host.docker.internal:9091']

  - job_name: 'billing'
    static_configs:
      - targets: ['host.docker.internal:9093']

  - job_name: 'game'
    static_configs:
      - targets: ['host.docker.internal:9092']

  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:9095']

  - job_name: 'leaderboard'
    static_configs:
      - targets: ['host.docker.internal:9094']
